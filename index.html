<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carica Carta su Supabase</title>
    <!-- Importiamo il client di Supabase tramite CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 100px; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registra Nuova Carta</h2>
    <form id="cardForm">
        <div class="form-group">
            <label for="rarity">Rarità</label>
            <select id="rarity" required>
                <option value="comuni">Comuni</option>
                <option value="non comuni">Non Comuni</option>
                <option value="rare">Rare</option>
                <option value="ultra rare">Ultra Rare</option>
                <option value="leggendarie">Leggendarie</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cardName">Nome Carta</label>
            <input type="text" id="cardName" required placeholder="Es. Drago Antico">
        </div>

        <div class="form-group">
            <label for="cardText">Testo Carta</label>
            <textarea id="cardText" required placeholder="Descrivi l'effetto o la storia della carta..."></textarea>
        </div>

        <div class="form-group">
            <label for="cardImage">Immagine Carta</label>
            <input type="file" id="cardImage" accept="image/*" required>
        </div>

        <button type="submit" id="submitBtn">Carica su Supabase</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // Le tue credenziali Supabase
    const SUPABASE_URL = 'https://tssgkiytaxmcrodrcrpu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3JHORvzXFoBh7XVVuSqgTg__ezQdQMa';
    
    // Inizializza il client Supabase
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Nomi dei due bucket separati
    const BUCKET_TEXTS = 'cards-texts';
    const BUCKET_IMAGES = 'cards-images';

    document.getElementById('cardForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        const rarity = document.getElementById('rarity').value;
        const rawName = document.getElementById('cardName').value.trim();
        const cardText = document.getElementById('cardText').value;
        const imageFile = document.getElementById('cardImage').files[0];

        if (!imageFile) {
            alert('Seleziona un\'immagine!');
            return;
        }

        // Pulisce il nome per renderlo sicuro come nome file
        const safeName = rawName.toLowerCase().replace(/[^a-z0-9]/g, '_');

        statusDiv.style.color = '#007BFF';
        statusDiv.textContent = 'Elaborazione in corso...';
        submitBtn.disabled = true;

        try {
            // 1. Salvataggio del file .txt (upsert: true sovrascrive se esiste già)
            const textBlob = new Blob([cardText], { type: 'text/plain;charset=utf-8' });
            const textPath = `${rarity}/${safeName}.txt`;

            const { error: textError } = await _supabase.storage
                .from(BUCKET_TEXTS)
                .upload(textPath, textBlob, { upsert: true });

            if (textError) throw textError;

            // 2. Ridimensionamento, conversione in WebP (465x645) e salvataggio (upsert: true sovrascrive se esiste già)
            const webpBlob = await resizeAndConvertToWebP(imageFile, 465, 645);
            const imagePath = `${rarity}/${safeName}.webp`;

            const { error: imageError } = await _supabase.storage
                .from(BUCKET_IMAGES)
                .upload(imagePath, webpBlob, { upsert: true });

            if (imageError) throw imageError;

            statusDiv.style.color = 'green';
            statusDiv.textContent = 'Caricamento completato con successo (file sovrascritti se esistenti)!';
            document.getElementById('cardForm').reset();

        } catch (error) {
            console.error(error);
            statusDiv.style.color = 'red';
            statusDiv.textContent = 'Errore durante il caricamento: ' + error.message;
        } finally {
            submitBtn.disabled = false;
        }
    });

    // Funzione di supporto per ridimensionare l'immagine e convertirla in WebP
    function resizeAndConvertToWebP(file, targetWidth, targetHeight) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');

                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('Conversione dell\'immagine fallita.'));
                        }
                    }, 'image/webp', 0.85);
                };
                img.onerror = (err) => reject(err);
            };
            reader.onerror = (err) => reject(err);
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
